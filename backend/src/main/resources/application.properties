spring.application.name=salary-management

spring.datasource.url=jdbc:sqlite:./data/salary.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# schema.sql runs after Hibernate creates/updates tables; see SalaryRecord's Javadoc.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# Only health and info are exposed - not the full actuator surface (env, beans, etc.).
management.endpoints.web.exposure.include=health,info
